# Noctalia desktop shell for the Niri session.
# Changes made in Noctalia's settings window are saved to
# ~/.local/state/noctalia/settings.toml and override this file.

[shell]
# Genkan settings below would be overwritten by the first-run wizard.
setup_wizard_enabled = false
# Graphical password prompts for apps that need elevated rights.
polkit_agent = true
# Closest free match to macOS's SF Pro.
font_family = "Inter"

[theme]
source = "builtin"
builtin = "Nord"

# Genkan draws the wallpaper.
[wallpaper]
enabled = false

# Genkan is the lock screen; swayidle in the Niri config locks before sleep.
[lockscreen]
enabled = false
lock_before_suspend = false

[shell.session]
[[shell.session.actions]]
action = "command"
command = "genkan lock --daemonize"
label = "Lock"
glyph = "lock"
shortcut = "1"

[[shell.session.actions]]
action = "logout"
shortcut = "2"

[[shell.session.actions]]
action = "suspend"
shortcut = "3"

[[shell.session.actions]]
action = "reboot"
shortcut = "4"

[[shell.session.actions]]
action = "shutdown"
shortcut = "5"
variant = "destructive"

# macOS-style menu bar: full width, thin, square, translucent.
[bar.default]
thickness = 26
margin_ends = 0
radius = 0
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0
concave_edge_corners = false
shadow = false
background_opacity = 0.55
padding = 12
widget_spacing = 14
start = [ "nixos", "active_window" ]
center = []
end = [ "tray", "recorder", "workspaces", "ai-usage", "pixel-buds", "airpods", "network", "battery", "spotlight", "control-center", "timezone-hub", "macclock" ]

# Apple-menu equivalent with the NixOS logo: lock, log out, sleep, reboot, shut down.
[widget.nixos]
type = "session"
custom_image = "/run/current-system/sw/share/icons/hicolor/scalable/apps/nix-snowflake-white.svg"
custom_image_colorize = false

[widget.spotlight]
type = "launcher"
glyph = "search"

[widget.active_window]
display = "text_only"
max_length = 400

[widget.workspaces]
style = "minimal"
hide_when_empty = true
focused_color = "on_surface"

[widget.macclock]
type = "clock"
format = "{:%a %b %-d  %-I:%M %p}"

[widget.control-center]
glyph = "adjustments-horizontal"

[widget.network]
show_label = false

# Earbud widgets from the community plugins Nix links into
# ~/.local/share/noctalia/plugins; both hide while their buds are disconnected.
[widget.pixel-buds]
type = "finoo125/pixel-buds:pixel-buds"

[widget.airpods]
type = "harveywuk/airpods:airpods"

# Official plugins: Screen Recorder and Translator
# (launcher only: type "/tr" in the launcher).
[widget.recorder]
type = "noctalia/screen_recorder:recorder"

# Compare cities and change the device timezone. Cities are added in its panel;
# its eye buttons pick which cities the icon's tooltip shows.
[widget.timezone-hub]
type = "ahmedhossamdev/timezone-hub:bar"

# Keeps the tooltip to city and time.
[plugin_settings."ahmedhossamdev/timezone-hub"]
show_date_in_bar = false

# AI plan and API usage from ai-usagebar (~/.config/ai-usagebar/config.toml).
# The capsule shows the two busiest accounts; click it for every account.
# Middle click edits the capsule's settings.
[widget.ai-usage]
type = "felipeartur/ai-usagebar:bar"
provider_limit = 2

[plugins]
enabled = [
    "ahmedhossamdev/timezone-hub",
    "felipeartur/ai-usagebar",
    "finoo125/pixel-buds",
    "harveywuk/airpods",
    "noctalia/screen_recorder",
    "noctalia/translator",
]
