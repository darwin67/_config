# ai-usagebar, the CLI behind Noctalia's AI Usage widget.
# Nix links this file read-only: add providers and accounts here, not with
# `ai-usagebar account add`.

# Claude plans.
[anthropic]
enabled = true
# Every login is named below, so hide the unnamed default.
show_default_account = false

[[anthropic.accounts]]
label = "primary"
credentials_path = "~/.claude/.credentials.json"

# Sign in once with: CLAUDE_CONFIG_DIR=~/.claude-work claude, then /login
[[anthropic.accounts]]
label = "backup"
credentials_path = "~/.claude-work/.credentials.json"

# Codex (ChatGPT) plans.
[openai]
enabled = true
show_default_account = false

[[openai.accounts]]
label = "primary"
codex_auth_path = "~/.codex/auth.json"

# Sign in once with: CODEX_HOME=~/.codex-work codex login
[[openai.accounts]]
label = "backup"
codex_auth_path = "~/.codex-work/auth.json"

# An OpenCode service account key limited to Usage: Read. It takes precedence
# over the OpenCode CLI login in ~/.local/share/opencode/auth.json.
[opencode-go]
enabled = true
api_key_env = "OPENCODE_GO_API_KEY"

[ollama]
enabled = true
api_key_env = "OLLAMA_API_KEY"

[deepseek]
enabled = true
api_key_env = "DEEPSEEK_API_KEY"

# API keys above come from sops-nix through the ai-usagebar wrapper
# in nixos/common/desktop/pkg.nix; this file only names the variables.

# On by default upstream; unused here.
[zai]
enabled = false

[openrouter]
enabled = false
