#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Darwin D. Wu"
email = "hello@darwindwu.com"
username = "darwin67"

[ui]
default-command = "default"
editor = "nvim"
pager = ":builtin"
diff-formatter = ":color-words"
diff-editor = ":builtin"
merge-editor = ":builtin"

[ui.graph]
style = "square"

[snapshot]
auto-update-stale = true

[git]
track-default-bookmark-on-clone = false
private-commits = "private()"

[remotes.origin]
auto-track-bookmarks = "darwin/*"

[colors]
change_id = "yellow"
"working_copy change_id" = "yellow"

[templates]
op_log = "builtin_op_log_comfortable"
git_push_bookmark = '"darwin/jj/" ++ change_id.short(8)'

[template-aliases]
builtin_log_compact = '''
if(root,
  format_root_commit(self),
  label(if(current_working_copy, "working_copy"),
    separate(" ",
      format_short_commit_header(self),
      if(empty, label("empty", "(empty)")),
      if(description,
        description.first_line(),
        label(if(empty, "empty"), description_placeholder),
      ),
    ),
  ),
)
'''

'format_short_commit_header(commit)' = '''
separate(" ",
  format_short_change_id_with_change_offset(commit),
  format_short_commit_id(commit.commit_id()),
  commit.bookmarks(),
  commit.tags(),
  commit.working_copies(),
  if(commit.conflict(), label("conflict", "conflict")),
  if(config("ui.show-cryptographic-signatures").as_boolean(),
    format_short_cryptographic_signature(commit.signature())
  ),
)
'''

'format_operation(op)' = '''
concat(
  format_time_range(op.time()), "\n",
  format_short_operation_id(op.id()), "\n",
  op.description().first_line(), "\n",
  if(op.attributes(), op.attributes() ++ "\n"),
)
'''

[revsets]
log = "(present(@) | ancestors(immutable_heads().., 2) | present(trunk())) & ~blacklist()"

[revset-aliases]
'wip()' = 'description("wip:*")'
'stash()' = 'description("stash:*")'
'blacklist()' = 'stash()'
'private()' = 'mutable() & (description(exact:"") | wip() | (empty() & ~merges())) | blacklist()'
'until(to)' = 'heads(::to & ~private())'
'until_bookmark(to)' = 'heads(::to & bookmarks())'
'branch(to)' = 'heads((::to | to::) & ~private())'
'branch_bookmark(to)' = 'heads((::to | to::) & bookmarks())'
'stack(to)' = 'stack(to, 2)'
'stack(to, n)' = 'ancestors(reachable(to, mutable() & ~blacklist()), n)'
'user(x)' = 'author(x) | committer(x)'

[aliases]
# log
l = ["log"]
lr = ["log", "-r"]
ls = ["log", "-r", "stash()"]
lp = ["log", "-r", "private() & ~stash()"]
lg = ["log", "-r", "all()"]

# diff
d = ["diff"]
ds = ["diff", "--summary"]
dst = ["diff", "--stat"]
dr = ["diff", "-r"]
dsr = ["diff", "--summary", "-r"]
dstr = ["diff", "--stat", "-r"]

# default
default = ["util", "exec", "--", "bash", "-c", 'echo "" && jj ds --no-pager && echo "" && jj lr "stack(@) | present(trunk())"']

# init and clone
init = ["git", "init", "--colocate"]
cl = ["git", "clone", "--colocate"]
clg = ["util", "exec", "--", "bash", "-c", "jj cl https://github.com/$0"]
clgp = ["util", "exec", "--", "bash", "-c", "jj cl git@github.com:$0"]
clgu = ["util", "exec", "--", "bash", "-c", "jj cl git@github.com:$(jj config get user.username)/$0"]

# new
n = ["new"]
nm = ["new", "-m"]
nt = ["new", "trunk()"]
ntm = ["new", "trunk()", "-m"]
nh = ["new", "heads(@::)"]
nhm = ["new", "heads(@::)", "-m"]
na = ["new", "-A"]
nae = ["new", "-A", "@"]
naem = ["new", "-A", "@", "-m"]
nb = ["new", "-B"]
nbe = ["new", "-B", "@"]
nbem = ["new", "-B", "@", "-m"]

# describe and commit
de = ["describe"]
dem = ["describe", "-m"]
ci = ["commit", "-i"]
cm = ["commit", "-m"]
cim = ["commit", "-i", "-m"]

# show and edit
w = ["show"]
ws = ["show", "--summary"]
wst = ["show", "--stat"]
e = ["edit"]
eh = ["edit", "heads(@::)"]
ep = ["prev", "--edit"]
epc = ["prev", "--edit", "--conflict"]
en = ["next", "--edit"]
enc = ["next", "--edit", "--conflict"]
eo = ["util", "exec", "--", "bash", "-c", 'jj --color=always lr "visible_heads() & mutable() & ~stash()" -G -T "builtin_log_compact ++ \"\n\"" | fzf --ansi --height 40% --reverse | cut -d" " -f1 | xargs jj edit']
eos = ["util", "exec", "--", "bash", "-c", 'jj --color=always lr "visible_heads() & mutable() & stash()" -G -T "builtin_log_compact ++ \"\n\"" | fzf --ansi --height 40% --reverse | cut -d" " -f1 | xargs jj edit']

# evolution and interdiff
el = ["evolog"]
elr = ["evolog", "-r"]
ew = ["evolog", "-n", "1", "--patch", "-G"]
ewr = ["evolog", "-n", "1", "--patch", "-G", "-r"]
i = ["interdiff"]
if = ["interdiff", "-f"]
it = ["interdiff", "-t"]

# rewrite
ad = ["abandon"]
adb = ["abandon", "--retain-bookmarks"]
adk = ["abandon", "--retain-bookmarks", "--restore-descendants"]
sp = ["split"]
spr = ["split", "-r"]
spp = ["split", "--parallel"]
sppr = ["split", "--parallel", "-r"]
sq = ["squash", "-i"]
sqa = ["squash"]
sqak = ["squash", "-k"]
sqt = ["squash", "-i", "-t"]
sqat = ["squash", "-t"]
sqakt = ["squash", "-k", "-t"]
sqf = ["squash", "-i", "-f"]
sqaf = ["squash", "-f"]
sqr = ["squash", "-i", "-r"]
sqar = ["squash", "-r"]

# rebase
rb = ["rebase", "--skip-emptied"]
rba = ["rebase", "--skip-emptied", "-A"]
rbb = ["rebase", "--skip-emptied", "-B"]
rbo = ["rebase", "--skip-emptied", "-o"]
rbt = ["rebase", "--skip-emptied", "-o", "trunk()"]
rbtr = ["rebase", "--skip-emptied", "-o", "trunk()", "-r"]
rbtw = ["rebase", "--skip-emptied", "-o", "trunk()", "-r", "until(@)"]
rbte = ["rebase", "--skip-emptied", "-o", "trunk()", "-r", "@"]
rbtb = ["rebase", "--skip-emptied", "-o", "trunk()", "-b"]
rbta = ["rebase", "--skip-emptied", "-o", "trunk()", "-b", "visible_heads() & mutable()"]
rbtse = ["rebase", "--skip-emptied", "-o", "trunk()", "-s", "@"]
rbe = ["rebase", "--skip-emptied", "-o", "@"]
rber = ["rebase", "--skip-emptied", "-o", "@", "-r"]
rbeb = ["rebase", "--skip-emptied", "-o", "@", "-b"]
rbea = ["rebase", "--skip-emptied", "-o", "@", "-b", "visible_heads() & mutable()"]
rbes = ["rebase", "--skip-emptied", "-o", "@", "-s"]
rbs = ["rebase", "--skip-emptied", "-s"]
rbse = ["rebase", "--skip-emptied", "-s", "@"]
rbr = ["rebase", "--skip-emptied", "-r"]
rbrw = ["rebase", "--skip-emptied", "-r", "until(@)"]
rbre = ["rebase", "--skip-emptied", "-r", "@"]
rbrb = ["rebase", "--skip-emptied", "-b"]

# restore and resolve
re = ["restore"]
rei = ["restore", "-i"]
rl = ["resolve"]
rlr = ["resolve", "-r"]
rll = ["resolve", "--list"]
rllr = ["resolve", "--list", "-r"]

# bookmarks
bd = ["bookmark", "delete"]
bf = ["bookmark", "forget"]
bl = ["bookmark", "list", "--all-remotes"]
blr = ["bookmark", "list", "-r"]
blrw = ["bookmark", "list", "-r", "until(@)"]
blrb = ["bookmark", "list", "-r", "branch(@)"]
bm = ["bookmark", "move"]
bmt = ["bookmark", "move", "-t", "trunk()"]
bmw = ["bookmark", "move", "-f", "until_bookmark(@)", "-t", "until(@)"]
bmb = ["bookmark", "move", "-f", "branch_bookmark(@)", "-t", "branch(@)"]
br = ["bookmark", "rename"]
bs = ["bookmark", "set"]
bsr = ["bookmark", "set", "--allow-backwards", "-r"]
bst = ["bookmark", "set", "--allow-backwards", "-r", "trunk()"]
bse = ["bookmark", "set", "--allow-backwards", "-r", "@"]
bt = ["bookmark", "track"]
bu = ["bookmark", "untrack"]

# remote, fetch, and push
rma = ["git", "remote", "add"]
rmao = ["git", "remote", "add", "origin"]
rmr = ["git", "remote", "remove"]
rmro = ["git", "remote", "remove", "origin"]
rml = ["git", "remote", "list"]
fr = ["git", "fetch", "--remote"]
fra = ["git", "fetch", "--all-remotes"]
f = ["util", "exec", "--", "bash", "-c", "jj fra && jj rbt"]
fa = ["util", "exec", "--", "bash", "-c", "jj fra && jj rbta"]
ps = ["git", "push"]
psr = ["git", "push", "--remote"]
psb = ["git", "push", "--bookmark"]
psc = ["git", "push", "--change"]
pscw = ["git", "push", "--change", "until(@)"]
pscb = ["git", "push", "--change", "branch(@)"]
psca = ["git", "push", "--change", "visible_heads() & ~private()"]
psa = ["git", "push", "--all"]
psd = ["git", "push", "--deleted"]

# pull requests
pro = ["util", "exec", "--", "bash", "-c", "gh pr create --head $(jj blrb -T name)"]
pr = ["util", "exec", "--", "bash", "-c", "jj pscb && jj pro"]
prow = ["util", "exec", "--", "bash", "-c", "gh pr create --head $(jj blrw -T name)"]
prw = ["util", "exec", "--", "bash", "-c", "jj pscw && jj prow"]

# operation log and undo
ol = ["op", "log"]
or = ["op", "restore"]
ov = ["op", "revert"]
oa = ["op", "abandon"]
ow = ["op", "show"]
ows = ["op", "show", "--summary"]
owst = ["op", "show", "--stat"]
owp = ["op", "show", "--patch"]
u = ["undo"]

# files and workspaces
fn = ["file", "annotate"]
fnr = ["file", "annotate", "-r"]
ft = ["file", "track"]
fu = ["file", "untrack"]
wt = ["workspace", "root", "--name"]
wl = ["workspace", "list"]
wa = ["util", "exec", "--", "bash", "-c", "jj workspace add --name $0 $(jj wt default).$0"]
wo = ["util", "exec", "--", "bash", "-c", 'jj --color=always wl | fzf --ansi --height 40% | cut -d":" -f1 | xargs jj wt']
wf = ["workspace", "forget"]
wr = ["workspace", "rename"]

# config and misc
cg = ["config", "get"]
cs = ["config", "set"]
csr = ["config", "set", "--repo"]
jj = ["util", "exec", "--", "jj"]
ignore = ["util", "exec", "--", "bash", "-c", 'jj csr snapshot.auto-track "$(jj cg snapshot.auto-track) & ~$0" && jj fu $0']
