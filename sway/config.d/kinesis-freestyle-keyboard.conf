#
# Kinesis freestyle keyboard mapping
#
bindsym F3 exec $ipc mic-volume-down
bindsym F4 exec $ipc mic-volume-up
bindsym F5 exec playerctl previous
bindsym F6 exec playerctl play-pause
bindsym F7 exec playerctl next
bindsym F8 exec $ipc volume-mute
bindsym F9 exec $ipc volume-down
bindsym F10 exec $ipc volume-up
bindsym F12 exec $ipc mic-mute
