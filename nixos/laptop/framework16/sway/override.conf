# Main display
output eDP-1 scale 1.2

# External displays
output "Dell Inc. DELL U2720QM 604QZ83" transform 270 scale 1.2

workspace 1 output "Dell Inc. DELL U3223QE 5PRFH34"
workspace 2 output "Dell Inc. DELL U2720QM 604QZ83"
workspace 3 output "Dell Inc. DELL S2421HGF DWH4B73"
workspace 8 output "Dell Inc. DELL S2421HGF DWH4B73"
workspace 9 output "Dell Inc. DELL S2421HGF DWH4B73"

for_window [app_id="^dev\.shosai\.shosai_flutter$"] move container to workspace number 8

#
# Framework 16 keyboard
#
bindsym F1 exec $ipc volume-mute
bindsym F2 exec $ipc volume-down
bindsym F3 exec $ipc volume-up
bindsym F4 exec playerctl previous
bindsym F5 exec playerctl play-pause
bindsym F6 exec playerctl next

bindsym F7 exec $ipc brightness-down eDP-1 5%
bindsym F8 exec $ipc brightness-up eDP-1 5%

# F9 is reduce mic volume
bindsym F9 exec $ipc mic-volume-down
# F10 is increase mic volume
bindsym F10 exec $ipc mic-volume-up
